name: Build Android APK

on:
  push:
    branches: [ "ana", "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        buildozer init || true
        sed -i 's/#requirements = python3,kivy/requirements = python3,pygame/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = zombiegame/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.zombie/g' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-dosyasi
        path: bin/*.apk
